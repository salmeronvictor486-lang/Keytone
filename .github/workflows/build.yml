name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Versión de Swift
        run: swift --version

      - name: Tests
        run: swift test

      - name: Compilar Keytone.app
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            export VERSION="1.0.0"
          fi
          export BUILD="$GITHUB_RUN_NUMBER"
          ./scripts/build-app.sh

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Keytone
          path: |
            dist/Keytone.dmg
            dist/Keytone.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Keytone.dmg
            dist/Keytone.zip
